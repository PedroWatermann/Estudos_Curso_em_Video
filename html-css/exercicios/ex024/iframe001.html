<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale='1.0'">
    <title>Estudos de iframe</title>

    <style>
        iframe {
            width: 300px;
            height: 600px;
        }
    </style>
</head>

<body>
    <h1>Testando o uso de iframe</h1>

    <p>Acessando o site do <a href="https://www.cursoemvideo.com" target="_blank">CursoEmVídeo</a> para aprender a programar.</p>

    <p>
        Acessando o site da 
        
        <iframe src="https://www.wikipedia.com" frameborder="0" height="500px" scrolling="yes">

        </iframe> 
        
        para testar o iframe.
    </p>

    <p>
        O site do 
        
        <iframe src="https://www.cursoemvideo.com" frameborder="0">
            <a href="https://cursoemvideo.com" target="_blank">Curso em Vídeo</a>
        </iframe> 
        
        também é legal, pena que não funciona dentro do iframe.
    </p>

    <p>
        O repositório do
        
        <iframe src="https://pedrowatermann.github.io/html_css/" frameborder="0">
            <a href="https://pedrowatermann.github.io/html_css/">Pedro Watermann</a>
        </iframe> 
        
        para aprender a programar.
    </p>
</body>

</html>
