<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>

    <style>
        body {
            background-color: cadetblue;
        }

        form {
            border: 1px solid black;
            padding: 10px;
        }
    </style>
</head>
<body>
    <button onclick="clicou()">Clique em mim!</button>
    <p></p>
    <div id="saida">Você clicou 0 vezes!</div>
    <p></p>

    <form action="oi.php" method="get">
        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="nome">
        <input type="submit" value="Cadastrar">
    </form>

    <script>
        let n = 0;

        function clicou() {
            let s = window.document.getElementById('saida');
            n++;

            if (n == 1) {
                s.innerHTML = `<p>Você clicou ${n} vez!</p>`;
            } else {
                s.innerHTML = `<p>Você clicou ${n} vezes!</p>`;
            }
        }
    </script>
</body>
</html>
