<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>

<body>
    <form action="cadastro.html" method="get" autocomplete="on">
        <p>
            <label for="ano">Em que ano você nasceu?</label>
            <input type="number" name="ano" id="ano" min="1900" max="2025" oninput="calcIdade()">
        </p>
        <p>
            <label for="idade">Você fará</label>
            <output id="idade">0</output>
            <label for="idade">anos neste ano.</label>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>

    <script>
        function calcIdade() {
            let atual = new Date().getFullYear();
            idade.innerHTML = Number(atual) - Number(ano.value);
        }
    </script>
</body>

</html>
