<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astronauta</title>
    <link rel="shortcut icon" href="imagens/astronauta.png" type="image/x-icon">

    <style>
        body {
            background: black url(imagens/espaco.jpg) center center / cover no-repeat fixed;
        }

        div {
            background-image: url(imagens/astronauta.png);
            background-size: contain;

            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>
    <div id="divAstronauta"></div>

    <script>
        // Instância do objeto Image, para que haja um carregamento assíncrono da imagem e de suas propriedades
        const astronauta = new Image();
        // Fonte da imagem
        astronauta.src = 'imagens/astronauta.png';
        // Função a ser executada quando a imagem for carregada
        astronauta.onload = function() {
            const div = document.getElementById('divAstronauta');
            div.style.width = `${astronauta.width}px`;
            div.style.height = `${astronauta.height}px`;
        };
    </script>
</body>

</html>
